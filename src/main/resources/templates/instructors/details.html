<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${instructor.fullName})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <div th:replace="~{fragments/layout :: messages}"></div>

    <a class="back" th:href="@{/instructors}">&larr; All instructors</a>

    <div class="page-header">
        <h1 th:text="${instructor.fullName}">Name</h1>
        <div class="actions">
            <a class="btn" th:href="@{/instructors/{id}/edit(id=${instructor.id})}">Edit</a>
            <form th:action="@{/instructors/{id}/delete(id=${instructor.id})}" method="post"
                  onsubmit="return confirm('Delete this instructor?');">
                <button type="submit" class="btn danger">Delete</button>
            </form>
        </div>
    </div>

    <div class="card">
        <p><strong>Email:</strong> <span th:text="${instructor.email}">email</span></p>
        <p th:if="${instructor.bio}" th:text="${instructor.bio}" class="bio">Bio</p>
        <p th:unless="${instructor.bio}" class="muted">No bio.</p>
    </div>

    <h2>Courses taught</h2>
    <p class="muted" th:if="${courses.isEmpty()}">This instructor doesn't teach any courses yet.</p>
    <ul th:unless="${courses.isEmpty()}">
        <li th:each="course : ${courses}">
            <a th:href="@{/courses/{id}(id=${course.id})}" th:text="${course.title}">Course</a>
            <span class="badge" th:text="${course.level}">LEVEL</span>
        </li>
    </ul>
</main>
</body>
</html>
