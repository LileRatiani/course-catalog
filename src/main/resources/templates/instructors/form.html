<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${instructorId == null} ? 'New instructor' : 'Edit instructor')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container narrow">
    <a class="back" th:href="${instructorId == null} ? @{/instructors} : @{/instructors/{id}(id=${instructorId})}">&larr; Back</a>

    <h1 th:text="${instructorId == null} ? 'New instructor' : 'Edit instructor'">Instructor</h1>

    <!--
        th:object  = the form object from the Model ("form")
        *{field}   = a field of that object
        novalidate = turn off the browser's own checks, so we can see SERVER-SIDE validation working
    -->
    <form th:action="${instructorId == null} ? @{/instructors} : @{/instructors/{id}(id=${instructorId})}"
          th:object="${form}" method="post" class="form" novalidate>

        <label for="firstName">First name *</label>
        <input id="firstName" type="text" th:field="*{firstName}" th:errorclass="invalid">
        <div class="field-error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>

        <label for="lastName">Last name *</label>
        <input id="lastName" type="text" th:field="*{lastName}" th:errorclass="invalid">
        <div class="field-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>

        <label for="email">Email *</label>
        <input id="email" type="email" th:field="*{email}" th:errorclass="invalid">
        <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

        <label for="bio">Bio</label>
        <textarea id="bio" rows="4" th:field="*{bio}" th:errorclass="invalid"></textarea>
        <div class="field-error" th:if="${#fields.hasErrors('bio')}" th:errors="*{bio}"></div>

        <button type="submit" class="btn primary" th:text="${instructorId == null} ? 'Create' : 'Save changes'">Save</button>
    </form>
</main>
</body>
</html>
