<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Students')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <div th:replace="~{fragments/layout :: messages}"></div>

    <div class="page-header">
        <h1>Students</h1>
        <a class="btn primary" th:href="@{/students/new}">+ New student</a>
    </div>

    <p class="muted" th:if="${students.isEmpty()}">No students yet. Create the first one!</p>

    <table th:unless="${students.isEmpty()}">
        <thead>
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Enrolled courses</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="student : ${students}">
            <td>
                <a th:href="@{/students/{id}(id=${student.id})}" th:text="${student.fullName}">Name</a>
            </td>
            <td th:text="${student.email}">email</td>
            <td th:text="${student.courses.size()}">0</td>
            <td class="actions">
                <a class="btn small" th:href="@{/students/{id}/edit(id=${student.id})}">Edit</a>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
